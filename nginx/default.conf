server_names_hash_bucket_size 64;
map_hash_bucket_size 512;
# Every static site contributes a redirect `map`, and each map is an entry in
# the variables hash. Past roughly sixty domains 2048 was no longer enough and
# nginx logged "could not build optimal variables_hash" on every single reload.
variables_hash_max_size 8192;

proxy_buffer_size   128k;
proxy_buffers   4 256k;
proxy_busy_buffers_size   256k;

include /etc/nginx/includes/gzip.conf;

include /etc/nginx/sites/maps/*.conf;

include /etc/nginx/sites/*.conf;
